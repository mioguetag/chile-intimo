<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chile Íntimo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400..700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
/* =====================================================
   Variables
   ===================================================== */
:root {
  color-scheme: light;
  --fondo: #ffffff;
  --panel: #efefed;
  --superficie: #e5e5e2;
  --tinta: #161616;
  --tenue: #8b8a85;
  --linea: #d5d4cf;
  --logo-filtro: none;
  --margen: clamp(10px, 2.2vw, 30px);
  --sans: "Archivo Narrow", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --mono: "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
  --chico: 11.5px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --fondo: #0c0c0c; --panel: #171716; --superficie: #222220; --tinta: #e8e6e1;
    --tenue: #85827c; --linea: #2f2e2b; --logo-filtro: invert(1);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --fondo: #0c0c0c; --panel: #171716; --superficie: #222220; --tinta: #e8e6e1;
  --tenue: #85827c; --linea: #2f2e2b; --logo-filtro: invert(1);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--fondo); color: var(--tinta); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 7; background: var(--fondo); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 1px solid var(--tinta); outline-offset: 2px; }
[hidden] { display: none !important; }
.mono { font-family: var(--mono); font-size: var(--chico); font-weight: 400; letter-spacing: -.01em; line-height: 1.45; }
.tenue { color: var(--tenue); }
.boton { border: 0; background: none; padding: 2px 0; color: inherit; white-space: nowrap; }
.boton:hover { text-decoration: underline; text-underline-offset: 3px; }
.boton:disabled { opacity: .35; cursor: default; text-decoration: none; }

/* =====================================================
   Intro: nube de fotos + logo animado
   ===================================================== */
.escena { transition: opacity .6s ease; }
body.con-intro .escena { opacity: 0; }

.intro { position: fixed; inset: 0; z-index: 100; overflow: hidden; background-color: var(--fondo); cursor: pointer; transition: background-color .9s ease, opacity .6s ease; }
.intro.acomodando { background-color: transparent; pointer-events: none; }
.intro.fuera { opacity: 0; }
.nube-foto { position: absolute; transform-origin: 0 0; opacity: 0; transform: scale(.4); transition: opacity .9s ease, transform 1.1s cubic-bezier(.2,.8,.2,1); will-change: transform; }
.intro.visible .nube-foto { opacity: var(--opacidad, 1); transform: none; }
.flota { width: 100%; height: 100%; animation: flotar 7s ease-in-out infinite alternate; }
.intro.acomodando .flota { animation: none; }
@keyframes flotar { from { transform: translate(-7px, 5px); } to { transform: translate(7px, -6px); } }
.flota > * { display: block; width: 100%; height: 100%; object-fit: cover; }
.intro-logo { position: absolute; inset: 0; z-index: 2; display: grid; place-content: center; pointer-events: none; transition: opacity .5s ease, transform .9s ease; }
.intro.acomodando .intro-logo { opacity: 0; transform: scale(.96); }
.saltar { position: absolute; z-index: 4; bottom: calc(var(--margen) + 18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); transition: opacity .4s ease; }
.intro.acomodando .saltar { opacity: 0; }

.logo { position: relative; width: min(340px, 52vw, 47vh); aspect-ratio: 867 / 918; }
.logo-parte { position: absolute; overflow: hidden; }
.logo-parte img { position: absolute; display: block; max-width: none; filter: var(--logo-filtro); }
.logo-chile img, .logo-intimo img { transform: translateY(105%); }
.intro.animando .logo-chile img { animation: logo-subir .8s cubic-bezier(.2,.8,.2,1) .1s forwards; }
.intro.animando .logo-intimo img { animation: logo-subir .8s cubic-bezier(.2,.8,.2,1) .28s forwards; }
@keyframes logo-subir { to { transform: translateY(0); } }
.logo-camara { opacity: 0; transform: scale(.8); transform-origin: 50% 60%;
  -webkit-mask: radial-gradient(ellipse 13% 18% at 49.4% 63.5%, transparent 98%, #000 100%);
  mask: radial-gradient(ellipse 13% 18% at 49.4% 63.5%, transparent 98%, #000 100%); }
.intro.animando .logo-camara { animation: logo-aparecer .45s ease-out .85s forwards; }
@keyframes logo-aparecer { to { opacity: 1; transform: none; } }
.logo-lente { overflow: visible; opacity: 0; transform: scale(0); }
.intro.animando .logo-lente { animation: logo-disparo .5s cubic-bezier(.3,1.6,.5,1) 1.25s forwards; }
@keyframes logo-disparo { 0% { opacity: 1; transform: scale(0); } 60% { opacity: 1; transform: scale(1.35); } 100% { opacity: 1; transform: scale(1); } }
.logo-linea1 img, .logo-linea2 img { clip-path: inset(0 100% 0 0); }
.intro.animando .logo-linea1 img { animation: logo-escribir .9s steps(17, end) 1.6s forwards; }
.intro.animando .logo-linea2 img { animation: logo-escribir .9s steps(17, end) 2.55s forwards; }
@keyframes logo-escribir { to { clip-path: inset(0 0 0 0); } }
.flash { position: absolute; inset: 0; z-index: 3; background: #fff; opacity: 0; pointer-events: none; }
.intro.animando .flash { animation: logo-destello .6s ease-out 1.3s; }
@keyframes logo-destello { 0% { opacity: 0; } 15% { opacity: .85; } 100% { opacity: 0; } }

/* =====================================================
   Lámina: el archivo enmarcado, con márgenes y marcas de registro
   ===================================================== */
.lamina {
  position: fixed;
  inset: calc(var(--margen) + env(safe-area-inset-top, 0px)) var(--margen) calc(var(--margen) + env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  background: var(--panel); border-radius: 12px; overflow: hidden;
}
.registro { position: fixed; z-index: 6; background: var(--tinta); opacity: .5; pointer-events: none; }
.registro.arriba { top: 0; left: 50%; width: 1px; height: calc(var(--margen) + 18px); }
.registro.abajo { bottom: 0; left: 50%; width: 1px; height: calc(var(--margen) + 18px); }
.registro.izq { left: 0; top: 50%; height: 1px; width: calc(var(--margen) + 18px); }
.registro.der { right: 0; top: 50%; height: 1px; width: calc(var(--margen) + 18px); }

/* Cabecera */
.cabecera {
  display: grid; grid-template-columns: minmax(170px, 1fr) minmax(0, 2.4fr) auto auto;
  align-items: start; gap: 10px 28px; padding: 18px 24px 14px; border-bottom: 1px solid var(--linea);
}
.cab-marca { display: flex; gap: 10px; align-items: baseline; }
.cab-marca h1 { margin: 0; font-weight: 700; font-size: 1.3rem; line-height: 1; letter-spacing: -.01em; }
.cab-descripcion { margin: 0; padding-left: 14px; border-left: 1px solid var(--linea); font-size: .98rem; line-height: 1.3; max-width: 52ch; }
.cab-cifras { margin: 0; color: var(--tenue); white-space: nowrap; }
.filtros-activos { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.filtros-activos:empty { display: none; }

/* Pie: navegación */
.pie { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 30px; padding: 12px 24px 14px; border-top: 1px solid var(--linea); }
.grupo { display: flex; align-items: center; gap: 14px; }
.rotulo { color: var(--tenue); }
.opcion { border: 0; background: none; padding: 0; color: var(--tenue); white-space: nowrap; }
.opcion.activa { color: var(--tinta); }
.opcion:hover { color: var(--tinta); }
.seccion { margin-left: auto; max-width: 34ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.buscar input { width: 200px; padding: 2px 0; border: 0; border-bottom: 1px solid var(--linea); background: transparent; color: var(--tinta); font: inherit; outline: none; }
.buscar input:focus { border-bottom-color: var(--tinta); }
.buscar input::placeholder { color: var(--tenue); }
body.vista-capas .zoom, body.vista-archivo .solo-capas { display: none; }
body.vista-capas .seccion { visibility: hidden; }

/* Etiquetas */
.chip { padding: 2px 7px; border: 1px solid var(--linea); border-radius: 3px; background: transparent; font-family: var(--mono); font-size: var(--chico); color: var(--tinta); }
.chip:hover { border-color: var(--tinta); }
.chip.activo { background: var(--tinta); border-color: var(--tinta); color: var(--panel); }
.chip.activo::after { content: "  ×"; }

/* =====================================================
   Contenido
   ===================================================== */
.contenido { position: relative; min-height: 0; }
.desplazable { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; }
.archivo { position: relative; margin: 20px 24px 36px; touch-action: pan-x pan-y; }
.foto { position: absolute; top: 0; left: 0; padding: 0; border: 0; overflow: hidden; background: var(--superficie); }
.foto img { display: block; width: 100%; height: 100%; object-fit: cover; }
.foto:hover { z-index: 1; outline: 1px solid var(--tinta); outline-offset: 1px; }
.sin-resultados { margin: 0; padding: 8px 0; color: var(--tenue); }
body.vista-capas .desplazable { display: none; }

/* Capas */
.capas { position: absolute; inset: 16px 24px 12px; }
body.vista-archivo .capas { display: none; }
#lienzo { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
.capas-tip {
  position: absolute; z-index: 2; display: flex; flex-direction: column; gap: 2px; max-width: 260px;
  padding: 8px 10px; border: 1px solid var(--linea); border-radius: 4px; background: var(--panel); pointer-events: none;
  box-shadow: 0 6px 20px rgb(0 0 0 / .08);
}
.capas-tip strong { font-weight: 500; }
.capas-todo { position: absolute; top: -6px; right: 0; z-index: 1; background: var(--panel); padding: 2px 4px; }

/* =====================================================
   Hoja de filtros
   ===================================================== */
.velo { position: absolute; inset: 0; z-index: 20; background: rgb(0 0 0 / .06); }
.hoja {
  position: absolute; z-index: 21; top: 0; right: 0; bottom: 0; width: min(420px, 100%);
  display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--linea);
  transform: translateX(101%); transition: transform .35s cubic-bezier(.2,.8,.2,1); visibility: hidden;
}
.hoja.abierta { transform: none; visibility: visible; box-shadow: -16px 0 40px rgb(0 0 0 / .06); }
.hoja-cabeza { display: flex; align-items: center; gap: 20px; padding: 18px 24px 14px; border-bottom: 1px solid var(--linea); }
.hoja-cabeza h2 { margin: 0 auto 0 0; font-size: 1.3rem; font-weight: 700; }
.hoja-cuerpo { flex: 1; overflow-y: auto; padding: 4px 24px 30px; }
.hoja-cuerpo h3 { margin: 22px 0 6px; font-family: var(--mono); font-size: var(--chico); font-weight: 400; color: var(--tenue); }
.categoria summary { list-style: none; cursor: pointer; }
.categoria summary::-webkit-details-marker { display: none; }
.categoria[open] summary .signo::before { content: "−"; }
.categoria summary .signo::before { content: "+"; }
.categoria ul, .personas { list-style: none; margin: 0 0 4px; padding: 0; }
.fila-lista {
  display: grid; grid-template-columns: 4.2em minmax(0, 1fr) auto; gap: 8px; align-items: baseline; width: 100%;
  padding: 6px 4px; border: 0; border-bottom: 1px solid var(--linea); background: none; text-align: left; color: var(--tinta);
}
.categoria ul .fila-lista { padding-left: 4.6em; grid-template-columns: minmax(0, 1fr) auto; }
.fila-lista:hover { background: var(--superficie); }
.fila-lista .num, .fila-lista .cuenta { color: var(--tenue); }
.fila-lista.activo { background: var(--tinta); color: var(--panel); }
.fila-lista.activo .num, .fila-lista.activo .cuenta { color: var(--panel); opacity: .7; }
#filtro-personas { width: 100%; margin: 2px 0 6px; padding: 6px 0; border: 0; border-bottom: 1px solid var(--tinta); background: transparent; color: var(--tinta); outline: none; }
.vacio { padding: 6px 4px; color: var(--tenue); }

/* =====================================================
   Visor: foto + ficha de archivo
   ===================================================== */
.visor { position: absolute; inset: 0; z-index: 30; display: grid; grid-template-columns: minmax(0, 1fr) 360px; background: var(--panel); }
.visor-imagen { position: relative; display: grid; place-items: center; min-width: 0; min-height: 0; padding: 28px; touch-action: pan-y; }
.visor-imagen img, .muestra { display: block; object-fit: contain; }
.muestra { display: grid; place-items: end start; padding: 12px; color: rgb(255 255 255 / .85); }
.visor-ficha { display: flex; flex-direction: column; gap: 20px; min-height: 0; padding: 18px 24px 18px; border-left: 1px solid var(--linea); overflow-y: auto; }
.ficha-cabeza { display: flex; justify-content: space-between; align-items: baseline; }
.visor-ficha h2 { margin: 0; font-family: var(--sans); font-size: 1.7rem; font-weight: 700; line-height: 1.02; letter-spacing: -.01em; }
.visor-ficha h2 .boton { font-weight: 700; text-align: left; white-space: normal; }
.ficha-datos { display: grid; grid-template-columns: 7.6em minmax(0, 1fr); gap: 5px 10px; margin: 0; }
.ficha-datos dt { color: var(--tenue); }
.ficha-datos dd { margin: 0; overflow-wrap: anywhere; }
.ficha-datos dd.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.ficha-nav { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 12px; border-top: 1px solid var(--linea); }

/* =====================================================
   Pantallas pequeñas
   ===================================================== */
@media (max-width: 900px) {
  .cabecera { grid-template-columns: 1fr auto; }
  .cab-descripcion { grid-column: 1 / -1; grid-row: 2; padding-left: 0; border-left: 0; }
  .cab-cifras { display: none; }
  .seccion { display: none; }
}
@media (max-width: 640px) {
  :root { --chico: 11px; }
  .cabecera, .pie, .hoja-cabeza, .hoja-cuerpo { padding-left: 16px; padding-right: 16px; }
  .archivo { margin: 14px 12px 28px; }
  .capas { inset: 12px 12px 8px; }
  .pie { gap: 8px 18px; }
  .zoom { display: none; }
  .buscar { width: 100%; }
  .buscar input { flex: 1; width: auto; }
  .visor { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1.2fr) minmax(0, 1fr); }
  .visor-imagen { padding: 14px; }
  .visor-ficha { border-left: 0; border-top: 1px solid var(--linea); padding: 14px 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .flota { animation: none; }
  .hoja { transition: none; }
}
  </style>
</head>

<script>
// Datos de ejemplo: categorías y subtemas reales, participantes y etiquetas ficticios.
function generarDemo() {
  let semilla = 20261108;
  const rnd = () => { semilla = (semilla * 16807) % 2147483647; return (semilla - 1) / 2147483646; };
  const gauss = () => { let u = 0; while (!u) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd()); };
  const TOTAL = 1565;

  const CATS = {
    "CUERPO": { total: 214, subs: { "Tatuaje": 70, "Pelo": 60, "Maquillaje": 58, "Piercing": 30, "Uñas": 26, "Gimnasio": 18, "Deportes": 13, "Cambios físicos": 10, "Barbería": 8, "Cejas": 4, "Skincare": 2 } },
    "GÉNERO": { total: 955, subs: { "Mujer": 640, "Hombre": 340, "Gay": 88, "Grupo de Amigas": 35, "Lesbiana": 21, "Madre-hija": 21, "Abuelas": 18, "Madre-hijo": 15, "No binaries": 7, "Marchas 8M": 4, "Viaje Sola": 3, "Feminismo": 1, "Trabajadoras": 1 } },
    "SELFIE": { total: 962, subs: { "Primer Plano (PP)": 400, "Retrato": 360, "Grupal": 200, "Espejo (general)": 90, "Manos": 45, "Baño / Espejo baño": 40, "Playa": 40, "Naturaleza": 35, "OOTD (Outfit of the Day)": 33, "Pies": 30, "Gestos con las manos": 25, "Filtros digitales": 20, "Auto": 16, "Ascensor": 15, "Rodillas / Piernas": 14, "Duckface": 10, "Mostrando la lengua": 10, "Gimnasio": 6, "Sombra": 3, "Morning Selfie": 2, "Palo selfie": 1 } },
    "DEMOGRAFÍA": { total: 474, subs: { "Mascotas": 315, "Familia": 90, "Migrantes": 44, "Pareja sin hijos": 15, "Embarazo": 12, "Pareja LGTBQI+": 7, "Pareja con 1 hijo": 6, "Ecografías": 1, "Partos": 1, "Jefa de hogar": 1 } },
    "CONSUMO": { total: 263, subs: { "Comidas": 242, "Auto": 12, "Shopping": 8, "Ropa": 1 } },
    "RITOS": { total: 155, subs: { "Cumpleaños": 39, "Matrimonio": 21, "Navidad": 17, "18 de Septiembre": 15, "Cumpleaños mascota": 15, "Halloween": 8, "Luto": 8, "Titulaciones": 7, "Año Nuevo": 6, "Graduaciones": 6, "Primer día de colegio": 6, "Bautizo": 3, "Pedida de matrimonio": 3, "Velorio y funeral": 2, "Fiesta de 15": 1 } },
    "TIEMPO LIBRE": { total: 388, subs: { "Viajes y vacaciones": 126, "Otros lugares icónicos": 74, "Paisajes": 45, "Atardecer": 41, "Tribus urbanas / Fanáticos": 32, "Obsesiones (flores/plantas)": 29, "Conciertos / Espectáculos": 26, "Cerro San Cristóbal": 22, "Costanera Center": 13, "MUT": 9, "Templo Bahái": 6, "Piscina": 5, "La Moneda": 4, "Cerro Santa Lucía": 3, "Letras volumétricas": 1 } },
    "HITOS": { total: 64, subs: { "Pandemia COVID-19": 32, "Estallido Social": 26, "Elecciones": 3, "MARCHA 8M": 3 } },
    "IA": { total: 16, subs: { "Trend": 7, "Estilo Studio Ghibli": 4, "Modificar rostro": 2, "Animación de imágenes": 2, "Cambio de ropa": 1, "Girlboss / Empowerment": 1, "Restauración": 1, "Figura 3D": 1 } },
    "ARCHIVO": { total: 152, subs: { "Foto análoga digitalizada": 70, "Retrato infancia": 65, "Cámara digital antigua": 48, "Grupo familiar": 14, "Con padres": 8, "Vacaciones archivo": 4 } },
  };

  function elegir(subs) {
    const entradas = Object.entries(subs);
    const total = entradas.reduce((s, [, n]) => s + n, 0);
    let r = rnd() * total;
    for (const [nombre, n] of entradas) { r -= n; if (r <= 0) return nombre; }
    return entradas[0][0];
  }

  const nombresConocidos = ["JOSÉ ARAVENA VARGAS", "MARIA SOLEDAD TORRES", "ABRAHAM SANTELICES URRUTIA"];
  const personas = [];
  let resto = TOTAL;
  let k = 0;
  while (resto > 0) {
    const n = Math.min(resto, Math.max(4, Math.round(10 + Math.abs(gauss()) * 22)));
    const mult = {};
    Object.keys(CATS).forEach((c) => { mult[c] = Math.exp(gauss() * 0.9) / 1.5; });
    personas.push({ nombre: nombresConocidos[k] || `PARTICIPANTE ${String(k + 1).padStart(3, "0")}`, n, mult });
    resto -= n;
    k++;
  }

  const FORMATOS = [[3, 4, .42], [9, 16, .16], [4, 3, .2], [16, 9, .08], [1, 1, .1], [2, 3, .04]];
  function formato() {
    let r = rnd();
    for (const [w, h, p] of FORMATOS) { r -= p; if (r <= 0) return [w, h]; }
    return [3, 4];
  }
  const imagenes = [];
  let num = 1;
  personas.forEach((p) => {
    for (let j = 0; j < p.n; j++) {
      const etiquetas = [];
      for (const [cat, info] of Object.entries(CATS)) {
        const prob = Math.min(0.95, (info.total / TOTAL) * p.mult[cat]);
        if (rnd() < prob) {
          const s1 = elegir(info.subs);
          etiquetas.push({ categoria: cat, subtema: s1 });
          if (rnd() < 0.18) {
            const s2 = elegir(info.subs);
            if (s2 !== s1) etiquetas.push({ categoria: cat, subtema: s2 });
          }
        }
      }
      const [fw, fh] = formato();
      imagenes.push({ codigo: `CHI${String(num).padStart(7, "0")}`, participante: p.nombre, archivo: null, ancho: fw * 400, alto: fh * 400, etiquetas });
      num++;
    }
  });

  const categorias = Object.keys(CATS).map((cat) => {
    const conteo = {};
    let total = 0;
    imagenes.forEach((img) => {
      const subs = img.etiquetas.filter((e) => e.categoria === cat);
      if (subs.length) total++;
      subs.forEach((e) => { conteo[e.subtema] = (conteo[e.subtema] || 0) + 1; });
    });
    return {
      nombre: cat,
      total,
      subtemas: Object.keys(conteo).sort((a, b) => a.localeCompare(b, "es")).map((s) => ({ nombre: s, total: conteo[s] })),
    };
  });

  const participantes = personas
    .map((p) => ({ nombre: p.nombre, total: p.n }))
    .sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));

  return { total_imagenes: imagenes.length, categorias, participantes, imagenes };
}


// =====================================================
// Configuración
// =====================================================
const ALTO_MIN = 18;            // alto mínimo de fila (px): textura
const ALTO_MAX = 480;           // alto máximo de fila (px)
const ALTO_INICIAL = 84;
const PROPORCION_DEFECTO = 3 / 4;

const INTRO_MAX_FOTOS = 260;
const INTRO_ESPERA = 4600;
const INTRO_VUELO = 1400;
const INTRO_DISPARO = 1300;

const CAPAS_ETIQUETA = 200;
const CAPAS_ALTO_PERSONAS = 24;
const CAPAS_ALTO_EJE = 22;
const CAPAS_COL_MAX = 160;
const MONO = `"Roboto Mono", ui-monospace, Menlo, monospace`;

const PALABRAS_MENORES = ["de", "del", "la", "las", "los", "y", "da", "di", "van", "von"];

const estado = { datos: null, filtros: [], participante: null, texto: "", vista: "archivo", fondo: "blanco", altoFila: ALTO_INICIAL };
let resultados = [];
let filas = [];
let visorIndice = -1;
const capas = { canvas: null, ctx: null, listo: false, ancho: 0, alto: 0, dpr: 1, fit: 1, colW: 1, desplaz: 0, hover: -1, bandas: [], ejeY: 0, personas: [], activos: null, fotos: new Map(), colores: null, pendiente: false };

// =====================================================
// Utilidades
// =====================================================
const $ = (sel) => document.querySelector(sel);
const azar = (min, max) => min + Math.random() * (max - min);
const limitar = (v, a, b) => Math.min(b, Math.max(a, v));
const num = (n, d) => String(n).padStart(d, "0");
const miles = (n) => n.toLocaleString("es-CL");
function escapar(t) { return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function normalizar(t) { return String(t == null ? "" : t).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }
function nombreBonito(t) {
  if (!t) return "Sin nombre";
  return String(t).toLowerCase().split(" ").map((p, i) => i > 0 && PALABRAS_MENORES.includes(p) ? p : p.charAt(0).toUpperCase() + p.slice(1)).join(" ");
}
function nombreCategoria(c) { const t = String(c).toLowerCase(); return t === "ia" ? "IA" : t.charAt(0).toUpperCase() + t.slice(1); }
function attrs(cat, sub) { return `data-categoria="${escapar(cat)}" data-subtema="${escapar(sub)}"`; }
function estaActivo(cat, sub) { return estado.filtros.some((f) => f.categoria === cat && f.subtema === sub); }
function hashTexto(t) { let h = 0; for (let k = 0; k < t.length; k++) h = (h * 31 + t.charCodeAt(k)) >>> 0; return h; }
function proporcion(img) { return img.ancho && img.alto ? img.ancho / img.alto : PROPORCION_DEFECTO; }
function textoFormato(img) {
  const r = proporcion(img);
  const comunes = [[1, 1], [4, 3], [3, 4], [3, 2], [2, 3], [16, 9], [9, 16]];
  const cerca = comunes.find(([a, b]) => Math.abs(r - a / b) / (a / b) < 0.03);
  const razon = cerca ? `${cerca[0]}:${cerca[1]}` : r.toFixed(2);
  const orient = Math.abs(r - 1) < 0.03 ? "cuadrada" : r > 1 ? "horizontal" : "vertical";
  return img.ancho && img.alto ? `${razon}, ${orient} (${img.ancho} × ${img.alto} px)` : `${razon}, ${orient} (estimado)`;
}

// Color de cada foto mientras no haya imagen (o su color dominante, si existe)
function colorFoto(img) {
  if (img.color) return img.color;
  const sub = img.etiquetas[0] ? img.etiquetas[0].subtema : "";
  const hb = hashTexto(sub);
  let hc = hashTexto(img.codigo);
  hc ^= hc >>> 13; hc = Math.imul(hc, 0x5bd1e995) >>> 0; hc ^= hc >>> 15;
  const tono = ((hb % 360) + ((hc >>> 16) % 40) - 20 + 360) % 360;
  const sat = sub ? 10 + (hc % 24) : 4;
  const luz = 26 + ((hc >>> 8) % 40);
  return `hsl(${tono} ${sat}% ${luz}%)`;
}
function colorSubtema(sub) { const h = hashTexto(sub); return `hsl(${h % 360} 30% 50%)`; }

function mostrarError(mensaje) {
  terminarIntro();
  $("#archivo").innerHTML = `<p class="sin-resultados mono">${escapar(mensaje)}</p>`;
}
window.addEventListener("error", (e) => mostrarError(`Error en la línea ${e.lineno}: ${e.message}`));

// =====================================================
// Arranque
// =====================================================
async function iniciar() {
  estado.datos = generarDemo();
  prepararDatos();
  let vista = "archivo";
  let fondo = "blanco";
  try {
    estado.altoFila = Number(localStorage.getItem("altoFila")) || ALTO_INICIAL;
    vista = localStorage.getItem("vistaPrincipal") || "archivo";
    fondo = localStorage.getItem("fondo") || "blanco";
  } catch (e) { /* nada */ }
  $("#total-personas").textContent = `(${estado.datos.participantes.length})`;
  dibujarCategorias();
  dibujarPersonas();
  conectarEventos();
  iniciarCapas();
  fijarFondo(fondo);
  fijarVista(vista, true);
  actualizar();
  requestAnimationFrame(() => requestAnimationFrame(reproducirIntro));
}

function prepararDatos() {
  const imgs = estado.datos.imagenes;
  imgs.sort((a, b) => a.codigo.localeCompare(b.codigo, "es", { numeric: true }));
  imgs.forEach((img, i) => {
    img._i = i;
    img._cats = {};
    img.etiquetas.forEach((e) => { if (!img._cats[e.categoria]) img._cats[e.categoria] = e.subtema; });
  });
  const tramos = [];
  imgs.forEach((img, i) => {
    const nombre = img.participante || "";
    const ultimo = tramos[tramos.length - 1];
    if (ultimo && ultimo.nombre === nombre) ultimo.fin = i; else tramos.push({ nombre, inicio: i, fin: i });
  });
  capas.personas = tramos;
}

function marcarOpcion(boton, activa) {
  boton.classList.toggle("activa", activa);
  boton.querySelector(".marca").textContent = activa ? "(x)" : "( )";
}

function fijarVista(vista, inicial) {
  estado.vista = vista === "capas" ? "capas" : "archivo";
  document.body.classList.toggle("vista-capas", estado.vista === "capas");
  document.body.classList.toggle("vista-archivo", estado.vista === "archivo");
  document.querySelectorAll("[data-vista]").forEach((b) => marcarOpcion(b, b.dataset.vista === estado.vista));
  try { localStorage.setItem("vistaPrincipal", estado.vista); } catch (e) { /* nada */ }
  if (estado.vista === "capas") capasRedimensionar();
  else if (!inicial) { maquetar(); actualizarSeccion(); }
}

function fijarFondo(fondo) {
  estado.fondo = fondo === "negro" ? "negro" : "blanco";
  document.documentElement.dataset.theme = estado.fondo === "negro" ? "dark" : "light";
  document.querySelectorAll("[data-fondo]").forEach((b) => marcarOpcion(b, b.dataset.fondo === estado.fondo));
  try { localStorage.setItem("fondo", estado.fondo); } catch (e) { /* nada */ }
  leerColores();
  programarDibujo();
}

// =====================================================
// Filtros
// =====================================================
function filtrar() {
  const q = normalizar(estado.texto);
  return estado.datos.imagenes.filter((img) => {
    if (estado.participante && img.participante !== estado.participante) return false;
    if (q && !normalizar(img.participante).includes(q) && !normalizar(img.codigo).includes(q)) return false;
    return estado.filtros.every((f) => img.etiquetas.some((e) => e.categoria === f.categoria && e.subtema === f.subtema));
  });
}
function alternarFiltro(categoria, subtema) {
  if (estaActivo(categoria, subtema)) estado.filtros = estado.filtros.filter((f) => !(f.categoria === categoria && f.subtema === subtema));
  else estado.filtros.push({ categoria, subtema });
  actualizar();
}
function marcarActivos() {
  document.querySelectorAll(".subtema").forEach((b) => b.classList.toggle("activo", estaActivo(b.dataset.categoria, b.dataset.subtema)));
  document.querySelectorAll(".persona").forEach((b) => b.classList.toggle("activo", b.dataset.participante === estado.participante));
}

function actualizar() {
  resultados = filtrar();
  capas.activos = new Set(resultados.map((img) => img._i));
  const total = estado.datos.imagenes.length;
  const n = resultados.length;
  $("#resumen").textContent = n === total
    ? `(${miles(total)}) imágenes   (${estado.datos.participantes.length}) participantes`
    : `(${miles(n)}) de ${miles(total)} imágenes`;

  const chips = estado.filtros.map((f) => `<button class="chip activo" ${attrs(f.categoria, f.subtema)} title="${escapar(nombreCategoria(f.categoria))}">${escapar(nombreCategoria(f.categoria))}: ${escapar(f.subtema)}</button>`);
  if (estado.participante) chips.unshift(`<button class="chip activo" data-quitar-participante>${escapar(nombreBonito(estado.participante))}</button>`);
  if (estado.texto) chips.unshift(`<button class="chip activo" data-quitar-texto>“${escapar(estado.texto)}”</button>`);
  $("#filtros-activos").innerHTML = chips.join("");

  const cantidad = estado.filtros.length + (estado.participante ? 1 : 0);
  $("#insignia").textContent = cantidad ? `(${cantidad})` : "";

  marcarActivos();
  dibujarArchivo();
  programarDibujo();
}

// =====================================================
// Archivo: filas justificadas con la proporción real de cada foto
// =====================================================
function dibujarArchivo() {
  const cont = $("#archivo");
  if (!resultados.length) {
    cont.style.height = "auto";
    cont.innerHTML = `<p class="sin-resultados mono">(0) No hay imágenes con esta combinación de filtros.</p>`;
    filas = [];
    $("#seccion").textContent = "";
    return;
  }
  cont.innerHTML = resultados.map((img, i) => {
    const visual = img.archivo ? `<img src="${escapar(img.archivo)}" alt="" loading="lazy" decoding="async">` : "";
    const fondo = img.archivo ? "" : `background:${colorFoto(img)}`;
    return `<button class="foto" data-indice="${i}" style="${fondo}" title="(${num(img._i + 1, 4)}) ${escapar(img.codigo)}, ${escapar(nombreBonito(img.participante))}">${visual}</button>`;
  }).join("");
  maquetar();
  $("#desplazable").scrollTop = 0;
  actualizarSeccion();
}

function maquetar() {
  const cont = $("#archivo");
  const W = cont.clientWidth;
  if (!W || !resultados.length || estado.vista !== "archivo") return;
  const objetivo = estado.altoFila;
  const g = objetivo < 40 ? 1 : 3;
  const els = cont.children;
  filas = [];
  let y = 0;
  let fila = [];
  let suma = 0;

  function cerrar(h) {
    let x = 0;
    fila.forEach((i) => {
      const w = proporcion(resultados[i]) * h;
      const el = els[i];
      el.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px)`;
      el.style.width = `${w.toFixed(2)}px`;
      el.style.height = `${h.toFixed(2)}px`;
      x += w + g;
    });
    filas.push({ y, h, primero: fila[0] });
    y += h + g;
    fila = [];
    suma = 0;
  }

  for (let i = 0; i < resultados.length; i++) {
    fila.push(i);
    suma += proporcion(resultados[i]);
    if (suma * objetivo + (fila.length - 1) * g >= W) cerrar((W - (fila.length - 1) * g) / suma);
  }
  if (fila.length) cerrar(Math.min(objetivo, (W - (fila.length - 1) * g) / suma));
  cont.style.height = `${y}px`;
}

function filaEn(yRel) {
  let lo = 0, hi = filas.length - 1, res = 0;
  while (lo <= hi) {
    const m = (lo + hi) >> 1;
    if (filas[m].y + filas[m].h > yRel) { res = m; hi = m - 1; } else lo = m + 1;
  }
  return res;
}
function filaDeIndice(indice) {
  let lo = 0, hi = filas.length - 1, res = 0;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (filas[m].primero <= indice) { res = m; lo = m + 1; } else hi = m - 1; }
  return res;
}
function posicionArchivo() { return $("#desplazable").scrollTop - $("#archivo").offsetTop; }

let seccionActual = "";
function actualizarSeccion() {
  if (!filas.length || estado.vista !== "archivo") return;
  const img = resultados[filas[filaEn(posicionArchivo() + 4)].primero];
  const texto = `(${num(img._i + 1, 4)}) ${nombreBonito(img.participante)}`;
  if (texto !== seccionActual) { seccionActual = texto; $("#seccion").textContent = texto; }
}

// Zoom manteniendo a la vista las fotos que se estaban mirando
let zoomPendiente = 1;
let zoomProgramado = false;
function zoomArchivo(factor) {
  zoomPendiente *= factor;
  if (zoomProgramado) return;
  zoomProgramado = true;
  requestAnimationFrame(() => {
    zoomProgramado = false;
    const nuevo = limitar(estado.altoFila * zoomPendiente, ALTO_MIN, ALTO_MAX);
    zoomPendiente = 1;
    if (!filas.length || Math.abs(nuevo - estado.altoFila) < 0.01) return;
    const desp = $("#desplazable");
    const base = $("#archivo").offsetTop;
    const fila = filas[filaEn(posicionArchivo() + 4)];
    const desfase = base + fila.y - desp.scrollTop;
    const ancla = fila.primero;
    estado.altoFila = nuevo;
    maquetar();
    desp.scrollTop = base + filas[filaDeIndice(ancla)].y - desfase;
    actualizarSeccion();
    try { localStorage.setItem("altoFila", String(Math.round(nuevo))); } catch (e) { /* nada */ }
  });
}

// =====================================================
// Visor: foto + ficha
// =====================================================
function abrirVisor(i) { visorIndice = i; $("#visor").hidden = false; pintarVisor(); }
function cerrarVisor() { $("#visor").hidden = true; visorIndice = -1; }
function moverVisor(paso) {
  const n = visorIndice + paso;
  if (n < 0 || n >= resultados.length) return;
  visorIndice = n;
  pintarVisor();
}
function pintarVisor() {
  const img = resultados[visorIndice];
  if (!img) return;
  $("#visor-num").textContent = `(${num(img._i + 1, 4)})`;
  $("#visor-nombre").innerHTML = img.participante
    ? `<button class="boton" data-participante="${escapar(img.participante)}" data-desde-visor title="Ver todas sus imágenes">${escapar(nombreBonito(img.participante))}</button>`
    : "Sin nombre";
  $("#visor-pos").textContent = `${num(visorIndice + 1, String(resultados.length).length)} / ${miles(resultados.length)}`;
  $("#visor-foto").innerHTML = img.archivo
    ? `<img src="${escapar(img.archivo)}" alt="">`
    : `<div class="muestra mono" style="background:${colorFoto(img)}">Imagen no disponible</div>`;
  ajustarVisor();

  const nombreArchivo = img.archivo ? img.archivo.split("/").pop() : "—";
  const porCategoria = {};
  img.etiquetas.forEach((e) => { (porCategoria[e.categoria] = porCategoria[e.categoria] || []).push(e.subtema); });
  const filasEtiquetas = Object.keys(porCategoria).map((cat) =>
    `<dt>${escapar(nombreCategoria(cat))}</dt><dd class="chips">${porCategoria[cat].map((s) =>
      `<button class="chip ${estaActivo(cat, s) ? "activo" : ""}" ${attrs(cat, s)}>${escapar(s)}</button>`).join("")}</dd>`).join("");

  $("#visor-datos").innerHTML = `
    <dt>Código</dt><dd>${escapar(img.codigo)}</dd>
    <dt>Archivo</dt><dd>${escapar(nombreArchivo)}</dd>
    <dt>Formato</dt><dd>${escapar(textoFormato(img))}</dd>
    ${filasEtiquetas || `<dt>Etiquetas</dt><dd>—</dd>`}`;

  $("#anterior").disabled = visorIndice <= 0;
  $("#siguiente").disabled = visorIndice >= resultados.length - 1;
}
function ajustarVisor() {
  if (visorIndice < 0) return;
  const caja = $("#visor-imagen");
  const m = $("#visor-foto").firstElementChild;
  if (!m) return;
  const cs = getComputedStyle(caja);
  const aw = caja.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = caja.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const r = proporcion(resultados[visorIndice]);
  let w = aw;
  let h = w / r;
  if (h > ah) { h = ah; w = h * r; }
  m.style.width = `${w}px`;
  m.style.height = `${h}px`;
}

function dibujarPersonas() {

    : `<li class="vacio">(0) Ningún nombre coincide.</li>`;

function abrirHoja() { $("#hoja").classList.add("abierta"); $("#velo").hidden = false; }
function cerrarHoja() { $("#hoja").classList.remove("abierta"); $("#velo").hidden = true; }

// =====================================================
// Intro
// =====================================================
let introTimer = null;
let introAcomodando = false;

function destinosIntro() {
  const vh = window.innerHeight;
  if (estado.vista === "capas" && capas.listo) {
    const r = capas.canvas.getBoundingClientRect();
    const banda = capas.bandas[0];
    const imgs = estado.datos.imagenes;
    const visibles = [];
    for (let i = 0; i < imgs.length; i++) {
      const x = r.left + CAPAS_ETIQUETA + capas.desplaz + i * capas.colW;
      if (x + capas.colW >= r.left + CAPAS_ETIQUETA && x <= r.right) visibles.push({ i, x });
    }
    const paso = Math.max(1, visibles.length / INTRO_MAX_FOTOS);
    const elegidos = [];
    for (let k = 0; k < visibles.length && elegidos.length < INTRO_MAX_FOTOS; k += paso) elegidos.push(visibles[Math.floor(k)]);
    return elegidos.map(({ i, x }) => ({ img: imgs[i], cuadrada: true, rect: { left: x, top: r.top + banda.y, width: Math.max(capas.colW, 1), height: banda.h } }));
  }
  const limite = $("#desplazable").getBoundingClientRect().bottom;
  const lista = [];
  for (const el of $("#archivo").children) {
    if (!el.classList.contains("foto")) continue;
    const rect = el.getBoundingClientRect();
    if (rect.top > Math.min(vh, limite)) break;
    if (rect.bottom > 0) lista.push({ img: resultados[Number(el.dataset.indice)], cuadrada: false, rect });
  }
  const paso = Math.max(1, lista.length / INTRO_MAX_FOTOS);
  const elegidos = [];
  for (let k = 0; k < lista.length && elegidos.length < INTRO_MAX_FOTOS; k += paso) elegidos.push(lista[Math.floor(k)]);
  return elegidos;
}

function visualIntro(img) {
  if (img.archivo) { const el = new Image(); el.src = img.archivo; el.alt = ""; return el; }
  const el = document.createElement("div");
  el.style.background = colorFoto(img);
  return el;
}

function reproducirIntro() {
  const intro = $("#intro");
  if (!intro) return;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { terminarIntro(); return; }
  $("#desplazable").scrollTop = 0;
  const vw = window.innerWidth, vh = window.innerHeight, cx = vw / 2, cy = vh / 2;
  const nube = $("#nube");
  const piezas = destinosIntro().map((d) => {
    const lado = azar(26, 96);
    const r = d.cuadrada ? 1 : d.rect.width / d.rect.height;
    const w = r >= 1 ? lado : lado * r;
    const h = r >= 1 ? lado / r : lado;
    const angulo = Math.random() * Math.PI * 2;
    const radio = Math.sqrt(azar(0.3, 1));
    const x = cx + Math.cos(angulo) * radio * vw * 0.47 - w / 2;
    const y = cy + Math.sin(angulo) * radio * vh * 0.45 - h / 2;
    const nodo = document.createElement("div");
    nodo.className = "nube-foto";
    nodo.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;transition-delay:${Math.round(azar(0, 700))}ms`;
    nodo.style.setProperty("--opacidad", (0.4 + (lado - 26) / 70 * 0.6).toFixed(2));
    const flota = document.createElement("div");
    flota.className = "flota";
    flota.style.animationDuration = `${azar(5, 9).toFixed(1)}s`;
    flota.style.animationDelay = `${-azar(0, 9).toFixed(1)}s`;
    flota.appendChild(visualIntro(d.img));
    nodo.appendChild(flota);
    nube.appendChild(nodo);
    return { nodo, rect: d.rect, x, y, w, h, distancia: Math.hypot(x + w / 2 - cx, y + h / 2 - cy) };
  });

  requestAnimationFrame(() => intro.classList.add("animando"));
  setTimeout(() => intro.classList.add("visible"), INTRO_DISPARO);

  function acomodar() {
    if (introAcomodando) return;
    introAcomodando = true;
    clearTimeout(introTimer);
    intro.classList.add("acomodando");
    const distanciaMax = Math.max(1, ...piezas.map((p) => p.distancia));
    let retrasoMax = 0;
    piezas.forEach((p) => {
      const retraso = Math.round((p.distancia / distanciaMax) * 400);
      retrasoMax = Math.max(retrasoMax, retraso);
      p.nodo.style.transition = `transform ${INTRO_VUELO}ms cubic-bezier(.65,0,.25,1) ${retraso}ms, opacity 400ms ease ${retraso}ms`;
      p.nodo.style.opacity = "1";
      p.nodo.style.transform = `translate(${p.rect.left - p.x}px, ${p.rect.top - p.y}px) scale(${p.rect.width / p.w}, ${p.rect.height / p.h})`;
    });
    setTimeout(terminarIntro, INTRO_VUELO + retrasoMax + 80);
  }
  introTimer = setTimeout(acomodar, INTRO_ESPERA);
  intro.addEventListener("click", acomodar);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") acomodar(); }, { once: true });
}

function terminarIntro() {
  clearTimeout(introTimer);
  document.body.classList.remove("con-intro");
  const intro = $("#intro");
  if (!intro) return;
  intro.classList.add("fuera");
  setTimeout(() => intro.remove(), 650);
}

// =====================================================
// Capas (tipo On Broadway)
// =====================================================
function leerColores() {
  const cs = getComputedStyle(document.documentElement);
  const v = (n) => cs.getPropertyValue(n).trim();
  capas.colores = { fondo: v("--panel"), tinta: v("--tinta"), tenue: v("--tenue"), linea: v("--linea"), superficie: v("--superficie") };
}

function iniciarCapas() {
  const canvas = $("#lienzo");
  capas.canvas = canvas;
  capas.ctx = canvas.getContext("2d");
  new ResizeObserver(() => capasRedimensionar()).observe($("#capas"));
  if (document.fonts) document.fonts.ready.then(programarDibujo);

  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    const p = posicionCursor(e);
    if (e.ctrlKey) acercarCapas(p.x, Math.exp(-e.deltaY * 0.01));
    else { capas.desplaz -= Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY; limitarDesplaz(); }
    programarDibujo();
  }, { passive: false });

  let arrastre = null;
  canvas.addEventListener("pointerdown", (e) => { arrastre = { x: e.clientX, desplaz: capas.desplaz, movio: false }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove", (e) => {
    const p = posicionCursor(e);
    if (arrastre) {
      const dx = e.clientX - arrastre.x;
      if (Math.abs(dx) > 4) arrastre.movio = true;
      if (arrastre.movio) { capas.desplaz = arrastre.desplaz + dx; limitarDesplaz(); }
    }
    const i = arrastre && arrastre.movio ? -1 : indiceEn(p.x, p.y);
    capas.hover = i;
    mostrarTip(i, p);
    programarDibujo();
  });
  canvas.addEventListener("pointerup", (e) => {
    const fue = arrastre;
    arrastre = null;
    if (fue && !fue.movio) {
      const p = posicionCursor(e);
      const i = indiceEn(p.x, p.y);
      if (i >= 0) {
        mostrarTip(-1);
        const enResultados = resultados.indexOf(estado.datos.imagenes[i]);
        if (enResultados >= 0) abrirVisor(enResultados);
      }
    }
  });
  canvas.addEventListener("pointerleave", () => { capas.hover = -1; mostrarTip(-1); programarDibujo(); });
  $("#capas-todo").addEventListener("click", () => { capas.colW = capas.fit; capas.desplaz = 0; programarDibujo(); });
}

function posicionCursor(e) { const r = capas.canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function indiceEn(x, y) {
  if (x < CAPAS_ETIQUETA || y > capas.ejeY) return -1;
  const i = Math.floor((x - CAPAS_ETIQUETA - capas.desplaz) / capas.colW);
  return i >= 0 && i < estado.datos.imagenes.length ? i : -1;
}
function acercarCapas(x, factor) {
  const datoX = Math.max(0, x - CAPAS_ETIQUETA);
  const pos = (datoX - capas.desplaz) / capas.colW;
  capas.colW = limitar(capas.colW * factor, capas.fit, CAPAS_COL_MAX);
  capas.desplaz = datoX - pos * capas.colW;
  limitarDesplaz();
}
function limitarDesplaz() {
  const ancho = capas.ancho - CAPAS_ETIQUETA;
  const total = estado.datos.imagenes.length * capas.colW;
  capas.desplaz = Math.min(0, Math.max(Math.min(0, ancho - total), capas.desplaz));
}
function capasRedimensionar() {
  if (!estado.datos || estado.vista !== "capas") return;
  const r = $("#capas").getBoundingClientRect();
  if (!r.width || !r.height) return;
  leerColores();
  const dpr = window.devicePixelRatio || 1;
  capas.ancho = r.width; capas.alto = r.height; capas.dpr = dpr;
  capas.canvas.width = Math.round(r.width * dpr);
  capas.canvas.height = Math.round(r.height * dpr);
  const N = estado.datos.imagenes.length;
  const ajustado = !capas.listo || capas.colW <= capas.fit + 1e-6;
  capas.fit = (r.width - CAPAS_ETIQUETA) / N;
  if (ajustado) { capas.colW = capas.fit; capas.desplaz = 0; }
  capas.colW = Math.max(capas.colW, capas.fit);
  capas.listo = true;
  calcularBandas();
  limitarDesplaz();
  dibujarCapas();
}
function calcularBandas() {
  const cats = estado.datos.categorias;
  const pesoTodas = 2.2;
  const unidad = (capas.alto - CAPAS_ALTO_PERSONAS - CAPAS_ALTO_EJE - 10) / (pesoTodas + cats.length);
  let y = CAPAS_ALTO_PERSONAS + 4;
  capas.bandas = [{ nombre: "TODAS", total: estado.datos.imagenes.length }].concat(cats.map((c) => ({ nombre: c.nombre, total: c.total }))).map((b, k) => {
    const alto = (k === 0 ? pesoTodas : 1) * unidad;
    const banda = { nombre: b.nombre, total: b.total, k, y, h: Math.max(alto - 4, 1) };
    y += alto;
    return banda;
  });
  capas.ejeY = y + 2;
}
function programarDibujo() {
  if (capas.pendiente || !capas.listo || estado.vista !== "capas") return;
  capas.pendiente = true;
  requestAnimationFrame(() => { capas.pendiente = false; dibujarCapas(); });
}
function obtenerFoto(src) {
  let f = capas.fotos.get(src);
  if (!f) { f = new Image(); f.decoding = "async"; f.onload = programarDibujo; f.src = src; capas.fotos.set(src, f); }
  return f;
}
function dibujarCelda(img, x, y, w, h, banda) {
  const ctx = capas.ctx;
  const foto = img.archivo ? obtenerFoto(img.archivo) : null;
  if (foto && foto.complete && foto.naturalWidth) {
    const rc = w / h, ri = foto.naturalWidth / foto.naturalHeight;
    let sw, sh;
    if (ri > rc) { sh = foto.naturalHeight; sw = sh * rc; } else { sw = foto.naturalWidth; sh = sw / rc; }
    ctx.drawImage(foto, (foto.naturalWidth - sw) / 2, (foto.naturalHeight - sh) / 2, sw, sh, x, y, w, h);
  } else {
    ctx.fillStyle = banda === "TODAS" ? colorFoto(img) : colorSubtema(img._cats[banda]);
    ctx.fillRect(x, y, w, h);
  }
}
function dibujarCapas() {
  if (!capas.listo || !capas.colores) return;
  const { ctx, ancho, alto, colW, desplaz } = capas;
  const c = capas.colores;
  const imgs = estado.datos.imagenes;
  const N = imgs.length;
  const x0 = CAPAS_ETIQUETA;
  ctx.setTransform(capas.dpr, 0, 0, capas.dpr, 0, 0);
  ctx.fillStyle = c.fondo;
  ctx.fillRect(0, 0, ancho, alto);
  const i0 = Math.max(0, Math.floor(-desplaz / colW));
  const i1 = Math.min(N - 1, Math.ceil((ancho - x0 - desplaz) / colW));
  const hueco = colW > 6 ? 1 : 0;
  const filtrando = capas.activos && capas.activos.size < N;

  ctx.save();
  ctx.beginPath(); ctx.rect(x0, 0, ancho - x0, alto); ctx.clip();
  ctx.fillStyle = c.linea;
  capas.bandas.forEach((b) => ctx.fillRect(x0, b.y + b.h + 1.5, ancho - x0, 1));
  dibujarTramosPersonas(i0, i1);
  for (let i = i0; i <= i1; i++) {
    const img = imgs[i];
    const x = x0 + desplaz + i * colW;
    const w = Math.max(colW - hueco, 0.75);
    ctx.globalAlpha = filtrando && !capas.activos.has(i) ? 0.1 : 1;
    for (const b of capas.bandas) {
      if (b.nombre === "TODAS" || img._cats[b.nombre]) dibujarCelda(img, x, b.y, w, b.h, b.nombre);
    }
  }
  ctx.globalAlpha = 1;
  if (capas.hover >= 0) {
    const x = x0 + desplaz + capas.hover * colW;
    ctx.strokeStyle = c.tinta; ctx.lineWidth = 1;
    ctx.strokeRect(Math.round(x) + 0.5, CAPAS_ALTO_PERSONAS, Math.max(colW, 1), capas.ejeY - CAPAS_ALTO_PERSONAS);
  }
  const pasos = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000];
  const paso = pasos.find((p) => p * colW >= 110) || 1000;
  ctx.font = `400 10.5px ${MONO}`;
  ctx.textBaseline = "top";
  ctx.fillStyle = c.tenue;
  for (let i = Math.ceil(i0 / paso) * paso; i <= i1; i += paso) {
    const x = x0 + desplaz + i * colW;
    ctx.fillRect(x, capas.ejeY, 1, 6);
    ctx.fillText(imgs[i].codigo, x + 4, capas.ejeY + 6);
  }
  ctx.restore();

  // Rótulos de cada franja
  ctx.fillStyle = c.fondo;
  ctx.fillRect(0, 0, x0, alto);
  ctx.fillStyle = c.linea;
  ctx.fillRect(x0 - 12, 0, 1, capas.ejeY);
  ctx.textBaseline = "top";
  ctx.font = `400 11px ${MONO}`;
  const fila = (numero, texto, y, cuenta) => {
    ctx.textAlign = "left";
    ctx.fillStyle = c.tenue;
    if (numero) ctx.fillText(numero, 0, y);
    ctx.fillStyle = c.tinta;
    ctx.fillText(texto, 36, y);
    if (cuenta != null) { ctx.textAlign = "right"; ctx.fillStyle = c.tenue; ctx.fillText(String(cuenta), x0 - 20, y); }
    ctx.textAlign = "left";
  };
  fila("", "Participantes", 7, estado.datos.participantes.length);
  capas.bandas.forEach((b) => fila(`(${num(b.k, 2)})`, b.nombre === "TODAS" ? "Todas" : nombreCategoria(b.nombre), b.y + 1, b.total));
  fila("", "Código", capas.ejeY + 6, null);
}
function dibujarTramosPersonas(i0, i1) {
  const { ctx, colW, desplaz } = capas;
  const c = capas.colores;
  const y = 4, h = CAPAS_ALTO_PERSONAS - 8;
  ctx.font = `400 10.5px ${MONO}`;
  ctx.textBaseline = "middle";
  capas.personas.forEach((t, k) => {
    if (t.fin < i0 || t.inicio > i1) return;
    const x = CAPAS_ETIQUETA + desplaz + t.inicio * colW;
    const w = (t.fin - t.inicio + 1) * colW;
    const sel = estado.participante && estado.participante === t.nombre;
    ctx.fillStyle = sel ? c.tinta : (k % 2 ? c.superficie : c.linea);
    ctx.fillRect(x, y, Math.max(w - 1, 0.5), h);
    const nombre = nombreBonito(t.nombre);
    const anchoTexto = ctx.measureText(nombre).width;
    if (w > anchoTexto + 12) {
      ctx.fillStyle = sel ? c.fondo : c.tinta;
      ctx.fillText(nombre, Math.min(Math.max(x, CAPAS_ETIQUETA) + 6, x + w - anchoTexto - 6), y + h / 2 + 1);
    }
  });
}
function mostrarTip(i, p) {
  const tip = $("#capas-tip");
  if (i < 0 || !p) { tip.hidden = true; return; }
  const img = estado.datos.imagenes[i];
  const temas = img.etiquetas.map((e) => escapar(e.subtema)).join(", ");
  tip.innerHTML = `<span class="tenue">(${num(i + 1, 4)}) ${escapar(img.codigo)}</span><strong>${escapar(nombreBonito(img.participante))}</strong>${temas ? `<span>${temas}</span>` : ""}`;
  tip.hidden = false;
  const derecha = p.x > capas.ancho - 290;
  tip.style.left = `${derecha ? p.x - 276 : p.x + 16}px`;
  tip.style.top = `${Math.min(p.y + 16, capas.alto - 110)}px`;
}

// =====================================================
// Eventos
// =====================================================
function conectarEventos() {
  const desp = $("#desplazable");
  let espera;
  $("#buscador").addEventListener("input", (e) => {
    clearTimeout(espera);
    espera = setTimeout(() => { estado.texto = e.target.value.trim(); actualizar(); }, 220);
  });
  $("#filtro-personas").addEventListener("input", dibujarPersonas);

  let scrollPendiente = false;
  desp.addEventListener("scroll", () => {
    if (scrollPendiente) return;
    scrollPendiente = true;
    requestAnimationFrame(() => { scrollPendiente = false; actualizarSeccion(); });
  }, { passive: true });

  new ResizeObserver(() => { maquetar(); actualizarSeccion(); ajustarVisor(); }).observe(desp);
  window.addEventListener("resize", ajustarVisor);

  // Pellizco en el trackpad (Ctrl + rueda) para cambiar el tamaño de las miniaturas
  desp.addEventListener("wheel", (e) => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    zoomArchivo(Math.exp(-e.deltaY * 0.012));
  }, { passive: false });

  // Pellizco táctil
  let dist0 = null;
  const distancia = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  desp.addEventListener("touchstart", (e) => { if (e.touches.length === 2) dist0 = distancia(e.touches); }, { passive: true });
  desp.addEventListener("touchmove", (e) => {
    if (e.touches.length === 2 && dist0) {
      e.preventDefault();
      const d = distancia(e.touches);
      zoomArchivo(d / dist0);
      dist0 = d;
    }
  }, { passive: false });
  desp.addEventListener("touchend", () => { dist0 = null; });

  // Deslizar en el visor para pasar de foto
  let toque = null;
  const visorImagen = $("#visor-imagen");
  visorImagen.addEventListener("pointerdown", (e) => { toque = e.clientX; });
  visorImagen.addEventListener("pointerup", (e) => {
    if (toque == null) return;
    const dx = e.clientX - toque;
    toque = null;
    if (Math.abs(dx) > 60) moverVisor(dx < 0 ? 1 : -1);
  });

  document.addEventListener("keydown", (e) => {
    if (!$("#visor").hidden) {
      if (e.key === "Escape") cerrarVisor();
      if (e.key === "ArrowRight") moverVisor(1);
      if (e.key === "ArrowLeft") moverVisor(-1);
      return;
    }
    if (e.key === "Escape") { cerrarHoja(); if (document.activeElement === $("#buscador")) limpiarBusqueda(); }
    if (document.activeElement && document.activeElement.tagName === "INPUT") return;
    if (e.key === "+" || e.key === "=") zoomArchivo(1.3);
    if (e.key === "-") zoomArchivo(1 / 1.3);
    if (e.key === "/") { e.preventDefault(); $("#buscador").focus(); }
  });

  document.addEventListener("click", (e) => {
    const t = e.target;
    if (t.closest("#intro")) return;

    const vista = t.closest("[data-vista]");
    if (vista) { fijarVista(vista.dataset.vista); return; }
    const fondo = t.closest("[data-fondo]");
    if (fondo) { fijarFondo(fondo.dataset.fondo); return; }

    const foto = t.closest(".foto");
    if (foto) { abrirVisor(Number(foto.dataset.indice)); return; }

    const etiqueta = t.closest("[data-categoria]");
    if (etiqueta) {
      if (!$("#visor").hidden) cerrarVisor();
      alternarFiltro(etiqueta.dataset.categoria, etiqueta.dataset.subtema);
      return;
    }

    const persona = t.closest("[data-participante]");
    if (persona) {
      const nombre = persona.dataset.participante;
      estado.participante = persona.hasAttribute("data-desde-visor") ? nombre : (estado.participante === nombre ? null : nombre);
      if (!$("#visor").hidden) cerrarVisor();
      actualizar();
      return;
    }

    if (t.closest("[data-quitar-participante]")) { estado.participante = null; actualizar(); return; }
    if (t.closest("[data-quitar-texto]")) { limpiarBusqueda(); return; }

    if (t.closest("#abrir-filtros")) { abrirHoja(); return; }
    if (t.closest("#cerrar-hoja") || t.closest("#velo")) { cerrarHoja(); return; }
    if (t.closest("#limpiar")) { estado.filtros = []; estado.participante = null; actualizar(); return; }
    if (t.closest("#menos")) { zoomArchivo(1 / 1.3); return; }
    if (t.closest("#mas")) { zoomArchivo(1.3); return; }
    if (t.closest("#cerrar-visor")) { cerrarVisor(); return; }
    if (t.closest("#anterior")) { moverVisor(-1); return; }
    if (t.closest("#siguiente")) { moverVisor(1); return; }
  });
}

iniciar();
</script>
</body>
</html>
